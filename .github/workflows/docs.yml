# Docs budget gate (issue #21; port of upstream rigor#119).
#
# ci.yml skips the Rust jobs for Markdown-only pull_request / merge_group
# diffs (and still uses paths-ignore on push). This workflow always runs,
# including in the merge queue, so the docs budget holds whether a change
# is docs-only or rides a code PR.
name: docs

on:
  push:
    branches: [main, master]
  pull_request:
  merge_group:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 harness/docs_check.py
