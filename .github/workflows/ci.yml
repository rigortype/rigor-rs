# Continuous integration: build + test on every push and pull request.
#
# This gates build, test, clippy and fixture parity on every push to a draft
# PR, so an agent pushes and keeps working instead of running them locally
# (AGENTS.md → Gates). Fixture parity is split in two reference-free/port-free
# halves that together equal `harness/run.rb`: `parity` compares the port with
# the committed snapshots, and `reference-snapshots` checks those snapshots
# against the live reference at the pinned submodule. The FP sweep
# (`harness/fp_audit.py --sweep`) needs machine-local corpora and stays a
# LOCAL pre-ready gate.
#
# rustfmt is intentionally not enforced (the codebase is hand-formatted; a
# recorded decision — see docs/adr/0032-source-formatting-policy.md and the
# documenting rustfmt.toml — NOT an oversight);
# clippy is BLOCKING (`-D warnings`): the workspace is clippy-clean (deliberate
# exceptions carry surgical per-item `#[allow]`s with rationale; `clippy.toml`
# holds clippy's suggestion-MSRV at 1.85 — below the 1.88 build floor that the
# `ruby-rbs` dep forces — so our own crates stay at 1.85-era idioms), so any NEW
# warning fails the run. The release pipeline lives in release.yml.
name: ci

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Pin to the declared MSRV (Cargo.toml rust-version).
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy

      # bindgen (ruby-prism-sys / ruby-rbs-sys) needs libclang at build time.
      - name: Install libclang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      # Cache the registry + build artifacts across runs.
      - uses: Swatinem/rust-cache@v2

      # --locked: build against the committed Cargo.lock (reproducible).
      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # Blocking: the workspace is clippy-clean, so `-D warnings` fails CI on any
      # new finding. `clippy.toml` holds the suggestion-MSRV at 1.85 (below the
      # 1.88 build floor) so clippy never proposes let-chain rewrites of our code.
      # --all-targets: tests and benches are linted too, so no local fresh-target
      # clippy run is needed before pushing.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Snapshot-mode parity gate (ADR-0002, §14 quality-management track c).
  #
  # The differential parity gate WITHOUT the reference Ruby checkout: rigor-rs
  # is compared against committed `harness/snapshots/*.json` (the reference's
  # pinned diagnostics, regenerated locally by `harness/snapshot.rb`). This
  # enforces the zero-false-positive bar on every PR. A separate job so a
  # parity regression is distinct from a build/test failure. Needs Ruby + the
  # built binary + the snapshots — NOT the reference checkout.
  parity:
    name: snapshot parity gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.88

      # bindgen (ruby-prism-sys / ruby-rbs-sys) needs libclang at build time.
      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - uses: Swatinem/rust-cache@v2

      # Build the rigor-rs binary the snapshot gate drives (debug is fine).
      - name: Build rigor-rs
        run: cargo build --locked -p rigor-cli

      # Ruby runs the gate script; no reference checkout is involved.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # Snapshot-mode gate: loads harness/snapshots/*.json instead of the live
      # reference, runs the binary, fails on any unregistered false positive.
      - name: Snapshot parity gate
        run: ruby harness/run_snapshot.rb

  # The committed snapshots must still be what the live reference says, at the
  # pinned submodule. Together with `parity` this is `harness/run.rb`, split so
  # neither half needs the other's toolchain: this job runs the reference only
  # (no Rust build). It fails when a fixture was added or the pin moved without
  # `ruby harness/snapshot.rb` being re-run.
  reference-snapshots:
    name: snapshots match the live reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The reference requires Ruby 4.0 (its Gemfile: ">= 4.0.0", "< 4.1").
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"

      # The harness runs the reference with plain `ruby -I`, not Bundler, so its
      # runtime gems go in the global gem dir, at the versions its lockfile pins.
      - name: Install the reference's runtime gems
        run: |
          for g in prism rbs language_server-protocol; do
            v=$(sed -n "s/^    $g (\\(.*\\))$/\\1/p" reference/rigor/Gemfile.lock)
            test -n "$v" || { echo "no $g pin in reference/rigor/Gemfile.lock"; exit 1; }
            gem install --no-document "$g:$v"
          done

      - name: Snapshots are current
        run: ruby harness/snapshot.rb --check
